<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — berdi-racing.com</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">

<div class="adm">

  <!-- ---------- login ---------- -->
  <div class="login" id="login">
    <h1>Edit website</h1>
    <p>Sign in to change texts, partners and results.</p>
    <form id="loginForm">
      <div class="fld"><label for="u">User name</label><input type="text" id="u" autocomplete="username" required></div>
      <div class="fld"><label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required
        style="width:100%;padding:9px 11px;border:1px solid #D9D5CC;background:#FCFBF9;font-family:inherit;font-size:14.5px;border-radius:2px"></div>
      <div class="err" id="loginErr"></div>
      <button type="submit" class="abtn abtn-g">Sign in</button>
    </form>
    <p class="note" id="loginNote"></p>
  </div>

  <!-- ---------- editor ---------- -->
  <div id="app" hidden>
    <div class="adm-bar" id="bar">
      <b>ADMIN</b>
      <span class="who" id="who"></span>
      <span class="dirty">● unsaved</span>
      <a class="abtn abtn-o" href="index.html" target="_blank" rel="noopener">View website</a>
      <button class="abtn abtn-o" id="btnDownload">Download file</button>
      <button class="abtn abtn-g" id="btnSave">Save</button>
      <button class="abtn abtn-o" id="btnLogout">Sign out</button>
    </div>

    <div class="adm-body">
      <nav class="adm-nav" id="tabs"></nav>
      <main class="adm-main" id="panels"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/labels.js"></script>
<script src="data/content.js"></script>
<script src="js/api.js"></script>
<script src="js/upload.js"></script>
<script src="js/admin.js"></script>
</html>
